name: ci

# 세 job 모두 읽기 전용이다 - 토큰 범위를 최소화하고 checkout 의 자격증명 잔존도 끈다.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run shellcheck on all shell assets
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -name '*.sh' -not -path './.git/*' | sort)
          files+=("hooks/commit-msg")
          echo "shellcheck targets:"
          printf '  %s\n' "${files[@]}"
          shellcheck "${files[@]}"

  block-test:
    name: block-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run healthcheck.sh self-test
        run: ./blocks/healthcheck.test.sh

      - name: Run run_container.sh self-test
        run: REQUIRE_DOCKER=1 ./blocks/run_container.test.sh

      - name: Run slot_decide.sh self-test
        run: ./blocks/slot_decide.test.sh

      - name: Run slot_switch.sh self-test
        run: ./blocks/slot_switch.test.sh

      - name: Run provision-alloy-ssm.sh self-test
        run: ./blocks/alloy/provision-alloy-ssm.test.sh

      - name: Run workspace-init.sh self-test
        run: ./workspace/workspace-init.test.sh

  # 추출 계약의 proto 정본(contracts/extraction.proto). lint·format 은 push·PR 모두, breaking 은 PR 에서만
  # main 과 비교한다 — 번호 재사용·타입 변경·필드 삭제·(JSON 와이어의) 필드명 변경을 머지 전에 막는다.
  # buf-action 의 통합 모드 대신 setup 만 쓰고 명령을 직접 부른다: 통합 모드는 PR 코멘트에 issues:write 를
  # 요구하고(이 워크플로는 읽기 전용), main 에 .proto 가 하나도 없던 첫 도입 PR 에서 breaking 이 "비교 대상
  # 모듈이 비었다"로 터진다 — 그 경우만 건너뛴다.
  contracts-proto:
    name: contracts-proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # breaking 이 같은 체크아웃의 main 을 읽는다(.git#branch=main).
          fetch-depth: 0

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: buf lint
        run: buf lint --error-format github-actions

      - name: buf format
        run: buf format --diff --error-format github-actions --exit-code

      - name: buf breaking (PR 에서만, main 에 proto 가 있을 때만)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if ! git ls-tree -r --name-only origin/main -- contracts | grep -q '\.proto$'; then
            echo "main 에 .proto 가 없다 - 첫 도입이라 breaking 비교를 건너뛴다"
            exit 0
          fi
          buf breaking --error-format github-actions --against '.git#branch=main'
