name: ci

# 세 job 모두 읽기 전용이다 - 토큰 범위를 최소화하고 checkout 의 자격증명 잔존도 끈다.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run shellcheck on all shell assets
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -name '*.sh' -not -path './.git/*' | sort)
          files+=("hooks/commit-msg")
          echo "shellcheck targets:"
          printf '  %s\n' "${files[@]}"
          shellcheck "${files[@]}"

  block-test:
    name: block-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run healthcheck.sh self-test
        run: ./blocks/healthcheck.test.sh

      - name: Run run_container.sh self-test
        run: REQUIRE_DOCKER=1 ./blocks/run_container.test.sh

      - name: Run slot_decide.sh self-test
        run: ./blocks/slot_decide.test.sh

      - name: Run slot_switch.sh self-test
        run: ./blocks/slot_switch.test.sh

      - name: Run provision-alloy-ssm.sh self-test
        run: ./blocks/alloy/provision-alloy-ssm.test.sh

      - name: Run workspace-init.sh self-test
        run: ./workspace/workspace-init.test.sh

  # 추출 계약의 proto 정본(contracts/extraction.proto). lint 는 push·PR 모두, breaking 은 PR 에서만
  # main 과 비교한다 — 번호 재사용·타입 변경·필드 삭제·(JSON 와이어의) 필드명 변경을 머지 전에 막는다.
  contracts-proto:
    name: contracts-proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: 'https://github.com/${{ github.repository }}.git#branch=main'
          push: false
          archive: false
