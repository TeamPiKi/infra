# 허거덩(Discord PR Bot)의 main 직접 푸시 경보 정본 — discord-pr-bot.yml 에서 분리했다.
# push 전용 job 을 PR 알림과 한 파일에 두면 pull_request 로 호출된 run 의 체크 목록에 매번 skipped 로 남는다.
# 소비 repo 는 push 트리거 전용 caller 로 호출한다
# (uses: TeamPiKi/infra/.github/workflows/discord-direct-push.yml@main + secrets: inherit).
name: Discord Direct Push Alert

on:
  workflow_call:

jobs:
  alert-direct-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # 이 커밋의 PR 조회만 함 = pull-requests read.
    permissions:
      pull-requests: read
    env:
      DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_PR_CHANNEL_ID }}
      DISCORD_API: https://discord.com/api/v10
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Check if direct push (not a PR merge)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 이 push 커밋과 연결된 PR 을 직접 조회한다. closed PR 20건 윈도우 스캔은 머지 직후 다른 PR 업데이트에 밀려
          # 대상 PR 을 놓쳐 정상 머지를 "직접 푸시"로 오분류(@here 오탐)할 수 있다. commits/{sha}/pulls 는 그 커밋의 PR 을 바로 준다.
          # 조회 실패(401/403/rate limit 등)를 pr_count=0 으로 흘리면 정상 머지를 직접푸시로 오인해 @here 를 쏜다.
          # HTTP 200 이 아니면 알림을 생략(fail-safe)한다 — pr_count=skip 은 아래 알림 스텝의 '== 0' 조건에 안 걸린다.
          HTTP_CODE=$(curl -s -o /tmp/pr_list.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls") || HTTP_CODE="000"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "commits/{sha}/pulls 조회 실패 (HTTP $HTTP_CODE) — 직접푸시 오탐 방지 위해 알림 생략"
            echo "pr_count=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR_COUNT=$(jq 'if type=="array" then length else 0 end' /tmp/pr_list.json)
          echo "pr_count=$PR_COUNT" >> "$GITHUB_OUTPUT"

      - name: Send Discord alert
        if: steps.check.outputs.pr_count == '0'
        shell: bash
        run: |
          [ -n "$DISCORD_USER_MAP" ] || DISCORD_USER_MAP='{}'

          PUSHER="${{ github.actor }}"
          DISCORD_ID=$(echo "$DISCORD_USER_MAP" | jq -r --arg login "$PUSHER" '.[$login] // empty')
          if [ -n "$DISCORD_ID" ]; then PUSHER_MENTION="<@$DISCORD_ID>"; else PUSHER_MENTION="$PUSHER"; fi

          COMMIT_MSG=$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH" | head -n 1)
          SHORT_SHA="${{ github.sha }}"; SHORT_SHA="${SHORT_SHA:0:7}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"

          SOUNDS=("비상비상 애옹애옹 🐱" "비상비상 멍멍멍멍 🐶" "비상비상 크르르릉~~~!!! 🐯" "비상비상 꽥꽥꽥꽥 🦆" "비상비상 어흥어흥!!! 🦁" "비상비상 뀨뀨뀨뀨 🐹" "비상비상 히이이잉~~~ 🐴" "비상비상 총총총총 🐰")
          SOUND="${SOUNDS[$RANDOM % ${#SOUNDS[@]}]}"

          # @here(=@everyone) 핑은 allowed_mentions 에 everyone·users 를 열어야 실제로 간다.
          TEXT=$(printf '@here 🚨🚨🚨 %s 님이 %s main에 **직접 푸시** 했어요!!\n%s\n\n• **커밋**: [%s](%s)\n• **메시지**: %s' \
            "$PUSHER_MENTION" "$REPO_NAME" "$SOUND" "$SHORT_SHA" "$COMMIT_URL" "$COMMIT_MSG")

          RESP=$(curl -s -X POST "$DISCORD_API/channels/$DISCORD_CHANNEL_ID/messages" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -n --arg content "$TEXT" '{content:$content, allowed_mentions:{parse:["everyone","users"]}}')")
          OK=$(echo "$RESP" | jq -r '.id // empty')
          if [ -z "$OK" ]; then
            echo "Discord post failed: $RESP"; exit 1
          fi
