name: ops-pull
description: >-
  비공개 ops repo 에서 사람이 확인한 커밋의 patches 항목 하나를 검사해 autofix/<id> PR 로 열고, 그 PR 의 승인 대기 CI 를 승인한다.
  .github 경로·바이너리·심볼릭 링크를 바꾸는 패치는 거부하고, 공개 repo 면 URL·금지어가 든 패치도 거부한다.
  호출자는 앞에서 actions/checkout 으로 이 repo 를 받고 job 에 contents·pull-requests·actions 쓰기를 준다.

inputs:
  id:
    description: 열 patches 항목의 id (YYYYMMDD-N). ops 이슈에 적혀 있다
    required: true
  ops-commit:
    description: 사람이 확인한 ops 커밋 sha (40자). ops 이슈에 적혀 있다
    required: true
  ops-deploy-key:
    description: ops 에 등록된 배포 키의 개인 키
    required: true
  ops-repo:
    description: 패치를 보관하는 비공개 repo (owner/name)
    default: TeamPiKi/ops
  base:
    description: PR base 브랜치
    default: main
  deny-pattern:
    description: 공개 repo 면 필수. 거부할 금지어의 확장 정규식. 단어 목록이 공개 코드에 남지 않게 시크릿으로 넘긴다
    default: ''
  github-token:
    description: PR 생성·CI 승인에 쓰는 토큰
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Fetch reviewed ops commit
      shell: bash
      env:
        OPS_REPO: ${{ inputs.ops-repo }}
        OPS_KEY: ${{ inputs.ops-deploy-key }}
        OPS_COMMIT: ${{ inputs.ops-commit }}
      run: |
        umask 077
        key="$RUNNER_TEMP/ops.key"
        trap 'rm -f "$key"' EXIT
        printf '%s\n' "$OPS_KEY" > "$key"
        GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
          "$GITHUB_ACTION_PATH/fetch.sh" --url "git@github.com:$OPS_REPO.git" --ref "$OPS_COMMIT" --dest "$RUNNER_TEMP/ops"

    - name: Open PR
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ID: ${{ inputs.id }}
        BASE: ${{ inputs.base }}
        DENY_PATTERN: ${{ inputs.deny-pattern }}
      run: '"$GITHUB_ACTION_PATH/pull.sh" --patches "$RUNNER_TEMP/ops/patches" --id "$ID" --base "$BASE"'
