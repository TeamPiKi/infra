name: ops-pull
description: >-
  비공개 ops repo 의 patches 항목을 사람이 승인한 것만 이 repo 의 autofix/<id> PR 로 연다.
  request: 아직 승인을 요청하지 않은 항목마다 승인 이슈를 만든다. 예약 실행용.
  approve: 승인 이슈의 체크박스를 쓰기 권한이 있는 사람이 체크하면 그 이슈의 커밋으로 PR 을 열고 이슈를 닫는다. issues edited 이벤트용.
  .github 경로·속성 파일·바이너리·심볼릭 링크·큰 diff·pr.md 의 HTML 은 거부하고, 공개 repo 면 URL·이메일·금지어가 든 패치도 거부한다.
  호출자는 앞에서 actions/checkout 으로 이 repo 를 받는다.

inputs:
  mode:
    description: request 또는 approve
    required: true
  ops-deploy-key:
    description: ops 에 등록된 배포 키의 개인 키
    required: true
  ops-repo:
    description: 패치를 보관하는 비공개 repo (owner/name)
    default: TeamPiKi/ops
  base:
    description: base 브랜치
    default: main
  window-days:
    description: request 에서 만든 지 이 일수가 지난 항목은 보지 않는다
    default: '2'
  deny-pattern:
    description: 공개 repo 의 approve 에서 필수. 거부할 금지어의 확장 정규식. 단어 목록이 공개 코드에 남지 않게 시크릿으로 넘긴다
    default: ''
  github-token:
    description: 이슈·브랜치·PR 쓰기와 CI 승인에 쓰는 토큰
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Check mode
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        case "$MODE" in request|approve) ;; *) echo "::error::mode must be request or approve"; exit 2;; esac

    - name: Check approval
      id: gate
      if: inputs.mode == 'approve'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        out=$("$GITHUB_ACTION_PATH/gate.sh")
        read -r id commit <<<"$out"
        echo "id=$id" >> "$GITHUB_OUTPUT"
        echo "commit=$commit" >> "$GITHUB_OUTPUT"

    - name: Fetch ops
      if: inputs.mode == 'request' || steps.gate.outputs.id != ''
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        OPS_REPO: ${{ inputs.ops-repo }}
        OPS_KEY: ${{ inputs.ops-deploy-key }}
        OPS_COMMIT: ${{ steps.gate.outputs.commit }}
      run: |
        umask 077
        key="$RUNNER_TEMP/ops.key"
        trap 'rm -f "$key"' EXIT
        printf '%s\n' "$OPS_KEY" > "$key"
        if [ "$MODE" = approve ]; then target=(--ref "$OPS_COMMIT"); else target=(--branch main); fi
        GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
          "$GITHUB_ACTION_PATH/fetch.sh" --url "git@github.com:$OPS_REPO.git" "${target[@]}" --dest "$RUNNER_TEMP/ops"

    - name: Request approvals
      if: inputs.mode == 'request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        OPS_REPO: ${{ inputs.ops-repo }}
        WINDOW_DAYS: ${{ inputs.window-days }}
      run: |
        "$GITHUB_ACTION_PATH/scan.sh" --ops "$RUNNER_TEMP/ops" --window-days "$WINDOW_DAYS" > "$RUNNER_TEMP/pending.txt"
        # 루틴이 항목을 대량으로 만들어도 이슈·알림이 쏟아지지 않게 실행마다 5건까지만 요청한다. 나머지는 다음 실행이 이어 받는다.
        head -n 5 "$RUNNER_TEMP/pending.txt" > "$RUNNER_TEMP/batch.txt"
        rc=0
        while read -r id commit; do
          number=$("$GITHUB_ACTION_PATH/request.sh" --id "$id" --commit "$commit" --ops-repo "$OPS_REPO") || { rc=1; continue; }
          echo "$id: approval issue #$number"
        done < "$RUNNER_TEMP/batch.txt"
        exit "$rc"

    - name: Open PR
      if: steps.gate.outputs.id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ID: ${{ steps.gate.outputs.id }}
        BASE: ${{ inputs.base }}
        DENY_PATTERN: ${{ inputs.deny-pattern }}
        ISSUE: ${{ github.event.issue.number }}
      run: |
        rc=0
        "$GITHUB_ACTION_PATH/open.sh" --patches "$RUNNER_TEMP/ops/patches" --id "$ID" --base "$BASE" \
          | tee "$RUNNER_TEMP/open.txt" || rc=$?
        number=$(sed -n "s/^$ID: opened #\([0-9][0-9]*\)$/\1/p" "$RUNNER_TEMP/open.txt")
        last=$(tail -n 1 "$RUNNER_TEMP/open.txt")
        close=1
        if [ -n "$number" ] && [ "$rc" = 0 ]; then
          msg="PR #$number 개시"
        elif [ -n "$number" ]; then
          msg="PR #$number 개시. CI 승인 실패라 PR 화면에서 직접 승인 필요"
        elif [ "$last" = "$ID: PR exists" ]; then
          msg="이미 PR 이 있음"
        else
          msg="PR 을 열지 못함 (${last#*"$ID: "})"
          close=0
        fi
        gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -f body="$msg" >/dev/null
        if [ "$close" = 1 ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$ISSUE" -f state=closed -f state_reason=completed >/dev/null
        fi
        exit "$rc"
