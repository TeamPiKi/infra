// 추출 API 계약의 와이어 모양 정본 (파일럿: POST /internal/extractions/link).
//
// 이 파일이 요청·응답의 **모양**(필드·타입·enum 이름)을 갖고, 각 필드의 의미와 전이 규약은
// extraction-api.md 가, 실패 code 의 분류(disposition·bucket)는 extraction-error-codes.yaml 이 갖는다.
// 소비 repo(core·extractor)는 빌드 시점에 이 파일에서 클래스를 생성해 쓴다 — 사람이 DTO 를 따로
// 쓰지 않으므로 필드명 개명이 한쪽만 되는 사고(currentPrice 사례)가 구조적으로 불가능하다.
//
// 와이어는 JSON 그대로다. protobuf 의 공식 JSON 매핑(lowerCamelCase 필드명, enum 은 이름 문자열,
// 미설정 필드 생략)이 지금 오가는 JSON 과 바이트 단위로 같도록 필드명을 골랐다. 그래서 이 파일을
// 소비하는 쪽과 아직 Jackson DTO 를 쓰는 쪽이 섞여 돌아도 깨지지 않는다 — 배포 순서 무관.
//
// 진화 규칙(extraction-api.md §5 와 같다): 필드는 추가만 한다. 번호 재사용·타입 변경·삭제는 CI 의
// `buf breaking` 이 막는다. 새 enum 값은 자유롭게 더한다 — 모르는 값을 받은 쪽은 UNSPECIFIED(0)로
// 읽고 tolerant reader 규약대로 처리한다.
//
// lint 예외: enum 값에 타입 접두사를 붙이지 않는다(ENUM_VALUE_PREFIX 제외, buf.yaml). 값 이름이
// 그대로 JSON 문자열이라 접두사를 붙이면 와이어가 바뀐다.

syntax = "proto3";

package piki.extraction.v1;

option java_multiple_files = true;
option java_package = "com.depromeet.piki.contracts.extraction.v1";

// POST /internal/extractions/link 요청.
message LinkExtractionRequest {
  // https 스킴의 상품 페이지 URL. 필수.
  string url = 1;
  // 이 대상이 플랫폼의 명시적 허락을 받았는가. 생략은 false 로 읽힌다(fail-safe).
  bool authorized = 2;
  // 이 요청의 LLM 모델. 생략·빈 문자열이면 Extractor 의 기본 모델.
  string model = 3;
}

// 값을 만든 추출 경로. 호출자가 snapshot 출처(SERVER/SERVER_LLM)를 가르는 근거.
enum ExtractionMethod {
  EXTRACTION_METHOD_UNSPECIFIED = 0;
  // 구조화 데이터(JSON-LD·OpenGraph) 직접 파싱 — 결정론적.
  STRUCTURED = 1;
  // Gemini LLM 추출 — URL 경로의 fallback 과 이미지 경로.
  LLM = 2;
}

// 성공 200 응답. 값 필드는 전부 선택이고 Extractor 는 name·image_url·current_price 중 하나 이상을 보장한다.
// optional 로 선언해 "안 채움"과 "0·빈 문자열"을 구분한다 — JSON 에서 미설정 필드는 생략된다.
message ExtractionResult {
  optional string name = 1;
  optional string image_url = 2;
  optional int32 current_price = 3;
  // ISO 4217. 단독으로 "채웠다"의 근거가 되지 못한다.
  optional string currency = 4;
  // 리다이렉트 귀결점. link 경로는 항상, image 경로는 없음.
  optional string final_url = 5;
  ExtractionMethod method = 6;
}

// 확정 실패 code. 목록은 extraction-error-codes.yaml 과 1:1 이어야 한다(소비 repo 의 메타 테스트가 대조).
// 분류(disposition·bucket·scope·escalatable)는 그 파일이 갖는다 — 여기엔 이름만 있다.
enum ExtractionErrorCode {
  EXTRACTION_ERROR_CODE_UNSPECIFIED = 0;

  NOT_PRODUCT_PAGE = 1;
  INVALID_URL = 2;
  EMPTY_SHELL = 3;
  NO_EXTRACTABLE_CONTENT = 4;
  FETCH_CLIENT_ERROR = 5;
  PERMANENT_UPSTREAM = 6;
  UNTRUSTWORTHY_VALUE = 7;
  LLM_INVALID_RESPONSE = 8;
  IMAGE_UNSUPPORTED = 9;
  BLOCKED_HOST = 10;
  TOO_MANY_REDIRECTS = 11;
  MALFORMED_REDIRECT = 12;

  UPSTREAM_ERROR = 13;
  LLM_UPSTREAM = 14;
  HEADLESS_BLOCKED = 15;
  HEADLESS_UPSTREAM = 16;
  STORAGE_ERROR = 17;

  MODEL_NOT_FOUND = 18;
  MODEL_INCOMPATIBLE = 19;
}

// 확정 실패 422 응답 body. 호출자의 전이 판정은 HTTP status 만 쓰고 code 는 관측·분류용이다.
message ExtractionFailure {
  ExtractionErrorCode code = 1;
}
